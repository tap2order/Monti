name: Deploy Monti

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-monti-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Monti to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          script: |
            set -e

            echo "Going to Monti project folder..."
            cd /var/www/monti

            echo "Syncing Monti code with origin/main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Deploying Monti server..."
            cd /var/www/monti/server
            npm install
            npx prisma generate
            npx prisma migrate deploy

            echo "Building Monti client..."
            cd /var/www/monti/client
            npm install
            npm run build

            echo "Restarting Monti PM2 process..."
            pm2 restart monti

            echo "Deployment finished. Current commit:"
            cd /var/www/monti
            git log -1 --oneline
