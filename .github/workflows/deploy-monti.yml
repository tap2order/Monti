name: Deploy Monti Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: monti-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Monti to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

    steps:
      - name: Run restricted VPS deployment over verified SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cat > "$HOME/.ssh/known_hosts" <<'KNOWN_HOSTS'
          78.47.119.6 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIPcDnkA1qkB3le3BP9wT+xvvFCNoNvZzAtqZbNIn5oE
          [78.47.119.6]:22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIPcDnkA1qkB3le3BP9wT+xvvFCNoNvZzAtqZbNIn5oE
          KNOWN_HOSTS
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            "$VPS_DEPLOY_USER@$VPS_HOST" true
